basePath: /decision-manager
definitions:
  decision_manager_request_dto.TriggerDecisionRequest:
    properties:
      applicationId:
        example: APP123456
        type: string
      businessType:
        example: Personal Loan
        type: string
      customerId:
        example: CUST123456
        type: string
      customerType:
        example: Personal Loan
        type: string
      leadId:
        example: 00Qtu1587ebf123456
        type: string
      loanCategory:
        example: Personal Loan
        type: string
      partnerName:
        example: Samsung
        type: string
      productLine:
        example: Personal Loan
        type: string
      salesChannelPartnerName:
        example: ""
        type: string
      sourcingChannel:
        example: ""
        type: string
      nameOfConsolidator:
        example: ""
        type: string
      programType:
        example: Repeat
        type: string
      sourcingProgram:
        example: Personal Loan
        type: string
      stage:
        example: Kyc
        type: string
      workflowId:
        example: 123e4567-e89b-12d3-a456-426614174000
